<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
    <h1>Something went wrong</h1>
    <p th:text="${message} ?: 'Unexpected error. Please go back and try again.'"></p>
    <a th:href="@{/}" class="btn">Back to dashboard</a>
</main>
</body>
</html>
